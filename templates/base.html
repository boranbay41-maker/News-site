{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NewsTalk - Свежие новости{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-newspaper"></i>
                <span>NewsTalk</span>
            </div>
            <div class="nav-search">
                <input type="text" placeholder="Поиск новостей...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <button class="hamburger-btn" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/" class="nav-link active"><i class="fas fa-home"></i> Главная</a></li>
                <li><a href="#" class="nav-link"><i class="fas fa-globe"></i> Мир</a></li>
                <li><a href="#" class="nav-link"><i class="fas fa-flag"></i> Узбекистан</a></li>
                <li><a href="#" class="nav-link"><i class="fas fa-chart-line"></i> Экономика</a></li>
                <li><a href="#" class="nav-link"><i class="fas fa-microchip"></i> Технологии</a></li>
            </ul>
        </div>
    </nav>

    <script>
        // Hamburger menu toggle
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const navMenu = document.getElementById('navMenu');
            
            if (hamburger) {
                hamburger.addEventListener('click', function() {
                    navMenu.classList.toggle('active');
                    hamburger.classList.toggle('active');
                });
                
                // Close menu when a link is clicked
                const navLinks = navMenu.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    link.addEventListener('click', function() {
                        navMenu.classList.remove('active');
                        hamburger.classList.remove('active');
                    });
                });
            }
        });
    </script>

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

    <a href="/newstalk-secret-panel/" style="color:#f8f8f8; font-size:6px;">·</a>

</body>
</html>
